<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-size: 11px;
            line-height: 1.4em;
            font-family: 'Avenir LT Std', sans-serif;
            /* font-family: 'Open Sans', sans-serif; */
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tr,
        th,
        td {
            padding: 3px 5px;
            vertical-align: top;
        }

        table,
        th,
        tr,
        td {
            border: 1px solid #7e7e7e;
        }

        /* tr, td {
        border: none;
        } */

        table.border-none,
        table.border-none td {
            border: none;
        }

        td.border {
            border: 1px solid #7e7e7e;
        }

        td.border-right {
            border-right: 1px solid #7e7e7e;
        }

        tr.border-bottom,
        td.border-bottom {
            border-bottom: 1px solid #7e7e7e;
        }

        .bold {
            font-family: 'Avenir LT Std', sans-serif;
            font-weight: 700;
            letter-spacing: 0.1ch;
        }

        .space {
            padding-left: 10px;
        }

        .line-break {
            padding-top: 7px;
        }

        .section-break {
            padding-top: 15px;
        }

        .table-title {
            letter-spacing: .3ch;
        }

        .reset-alpha-index {
            counter-reset: Serial;
        }

        .alpha-index:before {
            counter-increment: Serial;
            /* content: counter(Serial, lower-alpha) "."; */
            content: counter(Serial) ".";
        }

        .section-title {
            letter-spacing: .3ch;
            font-size: 1.2em;
            padding-bottom: 10px;
        }

        /* Fake Checkbox */
        .checkbox {
            display: inline-block;
            width: 7px;
            height: 7px;
            border: 1px solid #3d3d3d;
            margin-right: 3px;
        }

        .checkbox.checked {
            background-color: #727272;
        }

        .page-break {
            page-break-after: always;
        }

        .avoid-break {
            page-break-inside: avoid;
        }
    </style>
</head>

<body>
    <h1>
        <%= tripTitle %>
    </h1>

    <div class="section-break"></div>

    <h1>
        <%= tripDuration %>
    </h1>

    <div class="section-break"></div>

    <h1>
        <%= tripStartDate %>
    </h1>

    <div class="page-break"></div>

    <% tripDetails.forEach((place, index) => { %>
        <div class="section-break"></div>
        <div style="border: 1px solid red;">
                <%= place.place %>
                <div class="section-break"></div>
                <%= place.date %>
                <div class="section-break"></div>
                <%= place.time %>
                <div class="section-break"></div>
                <%= place.description %>
                <div class="section-break"></div>
                <img src="<%= place.imageUrl %>" alt="place image" width="200" height="150" />
            </div>
            <div class="section-break"></div>
    <% }) %>
</body>

</html>
